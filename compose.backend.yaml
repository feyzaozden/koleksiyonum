name: koleksiyonum-backend-dev
services:
  migrate:
    profiles: [tools]
    build: ./backend
    image: koleksiyonum-backend:local
    command: [node, src/migrate.js]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: collection_dev
      PGUSER: collection_admin
      PGPASSWORD: ${LOCAL_DB_ADMIN_PASSWORD:?Local admin password required}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: collection_admin
      POSTGRES_DB: collection_dev
      POSTGRES_PASSWORD: ${LOCAL_DB_ADMIN_PASSWORD:?Local admin password required}
      APP_DB_PASSWORD: ${LOCAL_DB_APP_PASSWORD:?Local application password required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sh:/docker-entrypoint-initdb.d/01-app-user.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U collection_admin -d collection_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  backend:
    build: ./backend
    image: koleksiyonum-backend:local
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: collection_dev
      PGUSER: collection_app
      PGPASSWORD: ${LOCAL_DB_APP_PASSWORD:?Local application password required}
      AUTH_ORIGIN: http://localhost:3001
      AUTH_LOCAL_REGISTRATION: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  postgres_data:
